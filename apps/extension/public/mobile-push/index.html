<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <title>CourseWatch 手机通知</title>
  </head>
  <body>
    <main>
      <h1>连接手机通知</h1>
      <p>通知由正在运行的 CourseWatch 电脑端发送。无需登录教学平台。</p>
      <p id="apple-guide">
        iPhone／iPad 需要 iOS／iPadOS 16.4 或更新版本。先复制下方配对码，再在
        Safari
        的分享菜单选择“添加到主屏幕”。从主屏幕打开本页，粘贴配对码并开启通知。
      </p>
      <form id="subscription-form">
        <label for="pair-code">电脑上的配对码</label>
        <textarea
          id="pair-code"
          rows="4"
          spellcheck="false"
          autocomplete="off"
          required
          placeholder="扫码打开时自动填写；也可以从电脑复制"
        ></textarea>
        <button id="copy-setup" type="button">复制配对码</button>
        <label for="device-name">设备名称</label
        ><input id="device-name" maxlength="80" value="我的手机" required />
        <button id="subscribe" type="submit">允许通知并生成订阅信息</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="result" hidden>
        <h2>传回电脑完成连接</h2>
        <p>
          复制以下信息到电脑端“手机通知 →
          导入订阅信息”，或保存文件后通过隔空投送等方式传回电脑。网页不上传订阅信息到中转服务器。请勿公开分享。
        </p>
        <label for="subscription">订阅信息</label
        ><textarea id="subscription" rows="7" readonly></textarea>
        <div class="actions">
          <button id="copy" type="button">复制订阅信息</button
          ><button id="download" type="button">保存订阅文件</button>
        </div>
      </section>
      <p>
        如果配对码过期，请在电脑端重新生成。手机通知受系统权限、专注模式和推送服务网络影响；发送成功仅表示服务接收。
      </p>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
