name: Update package download badge

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/downloads-badge.yml

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'BeifengFlying/CourseWatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'codex/download-stats';
            const path = 'downloads.json';
            // Include public prereleases; exclude checksums and unrelated assets.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const total = releases.filter(release => !release.draft)
              .flatMap(release => release.assets)
              .filter(asset => /^CourseWatch-.*\.(dmg|exe|zip)$/i.test(asset.name))
              .reduce((sum, asset) => sum + asset.download_count, 0);
            const payload = JSON.stringify({
              schemaVersion: 1, label: 'downloads', message: String(total), color: 'red',
            }) + '\n';
            let existing;
            try {
              existing = (await github.rest.repos.getContent({
                owner, repo, path, ref: branch,
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && Buffer.from(existing.content, 'base64').toString() === payload) {
              core.info(`Package downloads unchanged: ${total}`);
              return;
            }
            // Keep generated statistics on a separate branch, outside source history.
            let branchExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              branchExists = false;
            }
            const message = `docs(stats): 更新软件包累计下载次数为 ${total}`;
            if (!branchExists) {
              const { data: tree } = await github.rest.git.createTree({
                owner, repo, tree: [{ path, mode: '100644', type: 'blob', content: payload }],
              });
              const { data: commit } = await github.rest.git.createCommit({
                owner, repo, message, tree: tree.sha, parents: [],
              });
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha,
              });
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, branch, path, message,
                content: Buffer.from(payload).toString('base64'),
                ...(existing ? { sha: existing.sha } : {}),
              });
            }
            core.info(`Package downloads: ${total}`);
