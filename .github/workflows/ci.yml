name: Build and core checks
on: [push, pull_request]
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run browser:install
      - run: npm test
      - name: Install system browser for package checks
        run: |
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            brew install --cask google-chrome
          fi
      - run: npm run build:mac -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: coursewatch-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
